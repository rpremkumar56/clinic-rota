<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFAFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Clinic Rota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFAFA;--card:#ffffff;--cream:#F4ECE4;--sand:#EBDDCF;
  --ink:#272D4E;--mute:#6B6F85;--line:#EDE3DA;
  --brand:#272D4E;--brand-2:#3356AA;--warn:#C2412F;--flame:#E95C4B;--hh:120px;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);padding-bottom:88px;font-size:15px;line-height:1.45}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
header{position:sticky;top:0;z-index:5;background:var(--paper);color:var(--ink);padding:10px 16px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px}
.clinic{font-family:var(--serif);font-size:30px;line-height:1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.share{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px}
.gear{background:var(--cream);border:0;color:var(--ink);border-radius:999px;width:40px;height:40px;font-size:18px}
.month{display:flex;align-items:center;gap:8px;margin-top:10px}
.month h1{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1;margin:0;flex:1;text-align:center}
.icon{background:var(--cream);border:0;color:var(--ink);border-radius:999px;width:42px;height:42px;font-size:20px}
main{padding:14px 16px;max-width:640px;margin:0 auto}
h2{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.1;margin:0 0 10px}
.switch{display:flex;background:var(--cream);border-radius:999px;padding:4px;margin-bottom:12px}
.switch button{flex:1;border:0;background:none;border-radius:999px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--mute)}
.switch button.on{background:var(--ink);color:#fff}
.switch.hdr{margin:12px 0 0}
.switch.hdr button{padding:8px 2px;font-size:13px}
.switch.hdr button.dis{opacity:.35;cursor:not-allowed}
.hrow{display:contents}
.both .ghead{grid-template-rows:auto auto;row-gap:4px}
.both .day{scroll-margin-top:calc(var(--hh) + 112px)}
.both .row.second{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.steps{display:flex;gap:6px;margin-bottom:12px}
.step{flex:1;text-align:center;font-size:13px;font-weight:600;padding:9px 4px;border-radius:999px;background:var(--cream);color:var(--mute);border:0}
.step.on{background:var(--brand-2);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;font-weight:600}
.tip{font-size:14px;color:var(--mute);margin:0 2px 12px}
.alert{background:#FEEEED;border:0;color:var(--warn);border-radius:20px;padding:14px 16px;font-size:14px;margin-bottom:12px;font-weight:500}
.alert.closable{position:relative;padding-right:48px}
.alert .x{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;background:rgba(233,92,75,.12);color:var(--warn);font-size:15px;border-radius:999px}
.alert ul{margin:4px 0 0;padding-left:18px}
.alert .btn{background:#fff;border-color:#fff;color:var(--warn)}
.info{background:#DCE2EF;color:var(--ink);border-radius:20px;padding:14px 16px;font-size:14px;margin-bottom:12px}
.ghead,.row{display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr)) 42px;gap:6px;align-items:center}
.doc .ghead,.doc .row{grid-template-columns:44px repeat(3,minmax(0,1fr))}
.ghead{position:sticky;top:var(--hh);z-index:4;background:var(--paper);padding:8px 7px 6px;margin:0 -2px}
.ghead div{font-size:12px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:999px;padding:5px 4px;color:#fff;min-height:1px}
.ghead div.plain{color:var(--mute);background:none}
.day{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:7px;margin-bottom:8px;scroll-margin-top:calc(var(--hh) + 52px)}
.day.sun{background:#FBF6F1}
.day.today{border-color:var(--brand-2);box-shadow:0 0 0 1px var(--brand-2)}
.date{text-align:center;line-height:1.05}
.date b{font-family:var(--serif);font-weight:400;font-size:26px;display:block}
.date span{font-size:11px;color:var(--mute);font-weight:500}
.cell{border:0;border-radius:12px;height:48px;font-size:13px;font-weight:700;position:relative;width:100%;padding:0 2px}
.cell small{display:block;font-size:10px;font-weight:500;opacity:.85;margin-top:1px}
.cell .ini{position:absolute;top:4px;left:7px;font-size:9px;font-weight:700;opacity:.6}
.cell.locked::after{content:"";position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:currentColor}
.busy{border:1px solid var(--line);background:#fff;border-radius:12px;height:48px;font-size:18px;filter:grayscale(1);opacity:.4;padding:0}
.busy.on{filter:none;opacity:1;background:#FFF1CF;border-color:#FFC857}
.consline{display:flex;flex-wrap:wrap;gap:5px;margin:7px 2px 1px 50px}
.cons{border:0;background:var(--cream);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink)}
.cons.absent{text-decoration:line-through;color:#a59a90;background:#fff;border:1px dashed var(--sand)}
.warn{color:var(--warn);font-size:12px;font-weight:500;margin:6px 4px 1px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(255,250,250,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 0 11px;font-size:12px;color:var(--mute);font-weight:500}
nav button b{display:block;font-size:19px;font-weight:400;margin-bottom:1px}
nav button.on{color:var(--ink);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:12px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px;font-weight:500}
input[type=text],input[type=number],input[type=month],input[type=time],select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:14px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair label{margin-top:8px}
.daychips{display:flex;gap:5px;flex-wrap:wrap}
.daychips button{border:0;background:var(--cream);border-radius:999px;padding:8px 11px;font-size:13px;font-weight:600;color:var(--mute)}
.daychips button.on{background:var(--ink);color:#fff}
.sep{border:0;border-top:1px solid var(--line);margin:16px 0 4px}
.btn{display:block;width:100%;padding:14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;margin-top:10px;text-align:center}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--warn);border-color:#F6CFC9}
.small{font-size:13px;color:var(--mute);line-height:1.55}
.badge{width:34px;height:34px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
/* Today */
.daynav{display:flex;align-items:flex-end;gap:8px;margin:6px 0 16px}
.daynav div{flex:1}
.daynav b{display:block;font-family:var(--serif);font-weight:400;font-size:52px;line-height:.95;letter-spacing:-.01em}
.daynav span{font-size:15px;color:var(--ink);font-weight:500;display:block;margin-top:6px}
.daynav button{border:0;background:var(--cream);border-radius:999px;width:44px;height:44px;font-size:20px;color:var(--ink)}
.grouphead{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 10px}
.grouphead h2{margin:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;border-radius:26px;padding:14px 14px 16px;min-height:132px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.tile .tn{font-size:14px;font-weight:600;color:var(--ink);padding-right:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts{font-family:var(--serif);font-size:34px;line-height:1;margin-top:18px}
.tile .tt{font-size:13px;font-weight:500;opacity:.85;margin-top:4px}
.tile.locked::after{content:"";position:absolute;top:18px;right:16px;width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.7}
.busypill{display:block;width:100%;margin-top:10px;border:1px dashed var(--sand);background:#fff;border-radius:999px;padding:12px 16px;font-size:14px;font-weight:600;text-align:left;color:var(--ink)}
.busypill.on{background:#FFF1CF;border:1px solid #FFC857}
.busypill span{color:var(--mute);font-weight:500}
.strip{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 14px 10px;margin:0 0 6px}
.grp{font-size:12px;font-weight:600;color:var(--mute);margin:10px 0 2px}
.grp:first-child{margin-top:0}
.srow{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;margin:6px 0}
.srow .sl{font-size:11px;font-weight:700}
.track{position:relative;height:18px;background:#F6F0EA;border-radius:999px;overflow:hidden}
.bar{position:absolute;top:2px;bottom:2px;border-radius:999px}
.line6{position:absolute;top:0;bottom:0;border-left:2px dashed #F0A79D}
.now{position:absolute;top:-2px;bottom:-2px;border-left:2px solid var(--flame)}
.ticks{position:relative;height:18px;margin-left:38px;margin-top:4px}
.tick{position:absolute;font-size:11px;color:var(--mute);transform:translateX(-50%);white-space:nowrap}
.tick:first-child{transform:none}
.tick:last-child{transform:translateX(-100%)}
.counts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.counts span{font-size:13px;background:var(--cream);border-radius:999px;padding:5px 11px}
.counts b{font-size:14px}
/* Planner */
.whos{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.who{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:20px;padding:10px 12px;background:#fff;text-align:left;font-size:15px;font-weight:600}
.who.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.who small{display:block;font-size:12px;color:var(--mute);font-weight:500}
.who .cnt{margin-left:auto;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--cream)}
.who .cnt.ok{background:#DDF1E4;color:#1F6B3F}
.who .cnt.bad{background:#FEEEED;color:var(--warn)}
.calh,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calh div{font-size:11px;text-align:center;color:var(--mute);font-weight:600;padding-bottom:2px}
.cday{min-height:62px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
.cday b{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1}
.cday.sun b{color:var(--warn)}
.cday.past{opacity:.4}
.cday.today{outline:2px solid var(--brand-2)}
.mini{font-size:9px;font-weight:700;border-radius:999px;padding:1px 4px;background:var(--c);color:#fff;border:1.5px solid var(--c)}
.mini.auto{background:#fff;color:var(--c);border-style:dashed}
.mini.fixed{background:#B9AEA4;border-color:#B9AEA4}
.mini.cl{background:#FEEEED;color:var(--warn);border-color:var(--flame)}
.cday.mine{background:var(--c);border-color:var(--c);color:#fff}
.cday.mine b{color:#fff}
.cday.mine .mini{border-color:#fff}
/* Sheet + toast */
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.show{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(39,45,78,.35)}
.sheet-card{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:28px 28px 0 0;padding:18px 16px;padding-bottom:max(18px,env(safe-area-inset-bottom));max-width:640px;margin:0 auto;max-height:86vh;overflow:auto}
.sheet-title{font-family:var(--serif);font-size:26px;line-height:1.1;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:8px;font-size:15px;font-weight:600;background:#fff}
.opt span{font-size:13px;font-weight:500;color:var(--mute)}
.opt.sel{outline:2px solid var(--brand-2)}
.sub{font-size:13px;font-weight:600;color:var(--mute);margin:14px 2px 8px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header id="hdr">
  <div class="top">
    <div class="clinic" id="clinicName"></div>
    <button class="share" id="shareBtn" onclick="shareNow()">Share</button>
    <button class="gear" onclick="setTab('settings')" aria-label="Settings">⚙</button>
  </div>
  <div class="switch hdr" id="hdrSwitch" role="tablist"></div>
  <div class="month" id="monthNav">
    <button class="icon" onclick="moveMonth(-1)" aria-label="Previous month">‹</button>
    <h1 id="monthTitle"></h1>
    <button class="icon" onclick="moveMonth(1)" aria-label="Next month">›</button>
  </div>
</header>
<main id="main"></main>
<nav>
  <button id="tab-today" onclick="setTab('today')"><b>☀</b>Today</button>
  <button id="tab-plan" onclick="setTab('plan')"><b>🗓</b>Off days</button>
  <button id="tab-rota" onclick="setTab('rota')"><b>☰</b>Rota</button>
  <button id="tab-summary" onclick="setTab('summary')"><b>📊</b>Summary</button>
</nav>
<div class="sheet" id="sheet">
  <div class="sheet-bg" onclick="closeSheet()"></div>
  <div class="sheet-card" role="dialog" aria-modal="true"><div class="sheet-title" id="sheetTitle"></div><div id="sheetOpts"></div></div>
</div>
<div id="toast" role="status"></div>

<script>
/* ---------- Constants ---------- */
const KEY='clinicRota.v1';
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const BLUE={fg:'#163A54',bg:'#B0DEF1',bar:'#7CC6E6'}, AMBER={fg:'#4A3300',bg:'#FFC857',bar:'#F5B730'}, VIOLET={fg:'#2A4A96',bg:'#DCE2EF',bar:'#9FB1DD'}, GREY={fg:'#6B5643',bg:'#EBDDCF',bar:'#EBDDCF'};
const SH={
  // Assistants
  S:  {label:'Split',        short:'Split',   time:'8–1, 4–8:30',  iv:[[480,780],[960,1230]], ...BLUE},
  SE: {label:'Second',       short:'Second',  time:'12–8:30',      iv:[[720,1230]],           ...AMBER},
  L:  {label:'Morning',      short:'Morning', time:'8–5',          iv:[[480,1020]],           ...VIOLET},
  // Doctors
  DS: {label:'Split',        short:'Split',   time:'9–1, 4–8:30',  iv:[[540,780],[960,1230]], ...BLUE},
  DE: {label:'Second',       short:'Second',  time:'12:30–8:30',   iv:[[750,1230]],           ...AMBER},
  DM: {label:'Morning',      short:'Morning', time:'10–1',         iv:[[600,780]],            ...VIOLET},
  CL: {label:'Casual leave', short:'CL',      time:'Casual leave', iv:[], fg:'#C2412F', bg:'#FEEEED', bar:'#FEEEED'},
  X:  {label:'No Sunday duty',short:'Sun off',time:'Not on Sundays',iv:[], fg:'#A8968A', bg:'#F6F0EA', bar:'#F6F0EA'},
  // Shared
  O:  {label:'Off',          short:'Off',     time:'Day off',      iv:[], ...GREY}
};
const COL={asst:['#2F7D6D','#C2412F','#6E4FB0'], doc:['#272D4E','#3356AA','#9A5B2E']};
const CONS_COL='#56607F';
const TEAM={asst:{label:'Assistants',one:'assistant'}, doc:{label:'Doctors',one:'doctor'}};
const DEF_DOC={names:['Dr. Geo','Dr. Shreya','Dr. Sri Niranchana'],defaults:['DS','DE','DM'],leaves:4,cl:2};
const DEF_CONS=[{name:'Dr. Niraksha',days:[2,4],start:900,end:1080},{name:'Dr. Shwetha Prasad',days:[1,3,5],start:960,end:1140}];

const pad=n=>String(n).padStart(2,'0');
const ymKey=(y,m)=>`${y}-${pad(m)}`;
const isoOf=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const todayIso=()=>isoOf(new Date());
const parseIso=s=>s.split('-').map(Number);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{const h=Math.floor(t/60),mm=t%60,h12=h>12?h-12:(h===0?12:h);return h12+(mm?':'+pad(mm):'')+(h>=12?' PM':' AM');};
const fmtRange=(a,b)=>{const f=t=>{const h=Math.floor(t/60),mm=t%60,h12=h>12?h-12:(h===0?12:h);return h12+(mm?':'+pad(mm):'');};
  const ap=t=>t>=720?'PM':'AM'; return ap(a)===ap(b)?`${f(a)}–${f(b)} ${ap(b)}`:`${f(a)} ${ap(a)}–${f(b)} ${ap(b)}`;};
const toHHMM=t=>`${pad(Math.floor(t/60))}:${pad(t%60)}`;
const now=new Date();

/* ---------- Storage ---------- */
function defaultDb(){
  return {settings:{clinic:'Apollo',names:['Debo','Jagadish','New person'],offs:5,
          startMonth:ymKey(now.getFullYear(),now.getMonth()+1),lastBackup:null,todayView:'all'},months:{}};
}
function load(){
  try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&d.settings&&d.months)return d;}}catch(e){}
  return defaultDb();
}
function migrate(){
  if(!db.doctors) db.doctors=JSON.parse(JSON.stringify(DEF_DOC));
  if(!db.consultants) db.consultants=JSON.parse(JSON.stringify(DEF_CONS));
  if(!db.settings.todayView) db.settings.todayView='all';
}
let db=load(); migrate();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){alert('This phone could not save the data. Please use Backup in Settings.');}
}
function monthData(y,m,create){
  const k=ymKey(y,m);
  if(!db.months[k]){ if(!create) return {cells:{},busy:{},snap:{},doc:{cells:{},snap:{}},cons:{}}; db.months[k]={cells:{},busy:{},snap:{}}; }
  const md=db.months[k]; md.cells=md.cells||{}; md.busy=md.busy||{}; md.snap=md.snap||{}; md.cons=md.cons||{};
  md.doc=md.doc||{cells:{},snap:{}}; md.doc.cells=md.doc.cells||{}; md.doc.snap=md.doc.snap||{};
  return md;
}
const teamData=(team,y,m,create)=>{const md=monthData(y,m,create);return team==='doc'?md.doc:md;};
const namesOf=team=>team==='doc'?db.doctors.names:db.settings.names;
const nameOf=(team,i)=>namesOf(team)[i]||`${team==='doc'?'Doctor':'Assistant'} ${i+1}`;
const defaultNames=team=>namesOf(team).every((n,i)=>n===`${team==='doc'?'Doctor':'Assistant'} ${i+1}`);
function initials(team,i){
  const n=nameOf(team,i).replace(/^dr\.?\s+/i,'').trim(), p=n.split(/\s+/);
  return (p.length>1?p[0][0]+p[1][0]:n.slice(0,2)).toUpperCase();
}
const shLabel=(team,c)=>team==='doc'&&c==='O'?'Leave':SH[c].label;
const shShort=(team,c)=>team==='doc'&&c==='O'?'Leave':SH[c].short;
const shTime=(team,c)=>team==='doc'&&c==='O'?'On leave':SH[c].time;

/* ---------- Shared logic ---------- */
function coverage(shifts,from,to,skip){
  const c=[];
  for(let t=from;t<to;t+=30){
    if(skip&&t>=skip[0]&&t<skip[1]) continue;
    let n=0;
    shifts.forEach(s=>{ if(s&&SH[s].iv.some(([a,b])=>t>=a&&t<b)) n++; });
    c.push([t,n]);
  }
  return c;
}
function baseDays(td,y,m){
  const n=new Date(y,m,0).getDate(), days=[];
  for(let d=1;d<=n;d++){
    const date=`${y}-${pad(m)}-${pad(d)}`;
    const cells=td.cells[date]||{}, snap=td.snap[date];
    const ov=Object.assign({}, snap?{0:snap[0],1:snap[1],2:snap[2]}:{}, cells);   // user cells win over a frozen day
    days.push({day:d,date,dow:new Date(y,m-1,d).getDay(),ov,cells,frozen:!!snap,off:[],shifts:[],locked:[],warn:[]});
  }
  return days;
}
const rot=(i,d)=>((i-d.day)%3+3)%3;
// Spread the remaining off days over weekdays, max 1 off per day
function fillOffs(days,count,target,skipDay){
  for(let guard=0;guard<300;guard++){
    const need=[0,1,2].filter(i=>count[i]<target).sort((a,b)=>count[a]-count[b]||a-b);
    if(!need.length) break;
    let placed=false;
    for(const i of need){
      const own=days.filter(d=>d.off.includes(i)).map(d=>d.day);
      let best=null,bs=-Infinity;
      days.forEach(d=>{
        if(d.dow===0||d.off.length||d.ov[i]||(skipDay&&skipDay(d))) return;
        let s=(own.length?Math.min(...own.map(x=>Math.abs(x-d.day))):40)*10-Math.abs(d.day-(2+i*3))*0.1;
        if(d.busy) s-=1000;
        if(s>bs){bs=s;best=d;}
      });
      if(best){best.off.push(i);count[i]++;placed=true;break;}
    }
    if(!placed) break;
  }
}

/* ---------- Assistants ---------- */
function generateAsst(y,m,carry){
  const md=teamData('asst',y,m,false), OFFS=Math.max(0,+db.settings.offs||5);
  const days=baseDays(md,y,m);
  days.forEach(d=>d.busy=!!md.busy[d.date]);
  const offCount=[0,0,0], sun=[0,0,0];
  days.forEach(d=>{ for(let i=0;i<3;i++) if(d.ov[i]==='O'){ d.off.push(i); offCount[i]++; if(d.dow===0) sun[i]++; } });
  days.forEach(d=>{
    if(d.dow!==0||d.off.length) return;
    const c=[0,1,2].filter(i=>!d.ov[i]&&offCount[i]<OFFS);
    if(!c.length) return;
    c.sort((a,b)=>(carry[a]+sun[a])-(carry[b]+sun[b])||offCount[a]-offCount[b]||rot(a,d)-rot(b,d));
    const i=c[0]; d.off.push(i); offCount[i]++; sun[i]++;
  });
  fillOffs(days,offCount,OFFS,d=>Object.values(d.ov).includes('L'));

  const tally=[0,1,2].map(()=>({S:0,SE:0,L:0,O:0}));
  days.forEach(d=>{
    const working=[0,1,2].filter(i=>!d.off.includes(i));
    let t=working.length===3?(d.busy?['SE','L','S']:['SE','S','S']):working.length===2?['SE','S']:working.length===1?['S']:[];
    d.shifts=[null,null,null];
    d.locked=[0,1,2].map(i=>!!d.cells[i]);
    d.off.forEach(i=>d.shifts[i]='O');
    working.forEach(i=>{const o=d.ov[i];if(o){d.shifts[i]=o;const k=t.indexOf(o);if(k>=0)t.splice(k,1);}});
    const free=working.filter(i=>!d.ov[i]);
    ['SE','L'].forEach(sh=>{
      while(t.includes(sh)&&free.length){
        free.sort((a,b)=>tally[a][sh]-tally[b][sh]||rot(a,d)-rot(b,d));
        const i=free.shift(); d.shifts[i]=sh; t.splice(t.indexOf(sh),1);
      }
    });
    free.forEach(i=>{d.shifts[i]=t.shift()||'S';});
    d.shifts.forEach((s,i)=>{ if(tally[i][s]!==undefined) tally[i][s]++; });

    if(d.off.length>1) d.warn.push(`${d.off.length} assistants are off`);
    if(d.dow===0&&!d.off.length) d.warn.push('No Sunday off is given');
    const cov=coverage(d.shifts,480,1230);
    const zero=cov.find(c=>c[1]===0);
    if(zero) d.warn.push(`No assistant at ${fmt(zero[0])}`);
    const eve=Math.min(...cov.filter(c=>c[0]>=1080).map(c=>c[1]));
    if(!zero&&eve<2&&working.length>=2) d.warn.push('Only 1 assistant after 6 PM');
    if(d.busy){
      const mid=Math.min(...cov.filter(c=>c[0]>=780&&c[0]<960).map(c=>c[1]));
      if(mid<2) d.warn.push('Busy day, but only 1 assistant 1–4 PM');
    }
  });
  const stats=[0,1,2].map(i=>({off:offCount[i],sun:sun[i],S:tally[i].S,SE:tally[i].SE,L:tally[i].L,
    req:days.filter(d=>d.cells[i]==='O').length}));
  const mw=[];
  stats.forEach((s,i)=>{ if(s.off!==OFFS) mw.push(`${nameOf('asst',i)} has ${s.off} off days. The target is ${OFFS}.`); });
  return {team:'asst',y,m,days,stats,mw,carry,shared:md.shared||null};
}

/* ---------- Doctors ---------- */
function generateDoc(y,m,carry){
  const md=teamData('doc',y,m,false), LV=Math.max(0,+db.doctors.leaves||4), CLM=Math.max(0,+db.doctors.cl||2);
  const defs=db.doctors.defaults;
  const days=baseDays(md,y,m);
  const leave=[0,0,0], cl=[0,0,0], sun=[0,0,0];
  const rotating=[0,1,2].filter(i=>defs[i]!=='DM');   // the Split and Second doctors share Sundays

  days.forEach(d=>{ for(let i=0;i<3;i++){
    if(d.ov[i]==='O'){ d.off.push(i); leave[i]++; if(d.dow===0) sun[i]++; }
    else if(d.ov[i]==='CL'){ d.off.push(i); cl[i]++; }
  }});
  // Sundays: only 1 of the rotating doctors works. The Sunday off counts as a leave day.
  days.forEach(d=>{
    if(d.dow!==0) return;
    const avail=rotating.filter(i=>!d.off.includes(i));
    if(avail.length<2) return;
    const c=avail.filter(i=>!d.ov[i]);
    if(!c.length) return;
    c.sort((a,b)=>(carry[a]+sun[a])-(carry[b]+sun[b])||leave[a]-leave[b]||rot(a,d)-rot(b,d));
    const i=c[0]; d.off.push(i); leave[i]++; sun[i]++;
  });
  fillOffs(days,leave,LV);

  const tally=[0,1,2].map(()=>({DS:0,DE:0,DM:0}));
  days.forEach(d=>{
    d.shifts=[null,null,null];
    d.locked=[0,1,2].map(i=>!!d.cells[i]);
    d.off.forEach(i=>d.shifts[i]=d.ov[i]==='CL'?'CL':'O');
    if(d.dow===0){
      [0,1,2].forEach(i=>{ if(d.shifts[i]) return; d.shifts[i]=d.ov[i]||(defs[i]==='DM'?'X':'DS'); });
    }else{
      const working=[0,1,2].filter(i=>!d.shifts[i]);
      working.forEach(i=>{ if(d.ov[i]) d.shifts[i]=d.ov[i]; });
      const free=working.filter(i=>!d.ov[i]);
      if(working.length>=3){ free.forEach(i=>d.shifts[i]=defs[i]); }
      else{
        const need=['DS','DE'].filter(s=>!working.some(i=>d.shifts[i]===s));
        free.forEach(i=>{ const k=need.indexOf(defs[i]); if(k>=0){ d.shifts[i]=defs[i]; need.splice(k,1); } });
        free.filter(i=>!d.shifts[i]).forEach(i=>{ d.shifts[i]=need.shift()||defs[i]; });
      }
    }
    d.shifts.forEach((s,i)=>{ if(tally[i][s]!==undefined) tally[i][s]++; });

    const offs=d.off.length;
    const work=d.shifts.filter(s=>SH[s].iv.length).length;
    if(d.dow!==0&&offs>1) d.warn.push(`${offs} doctors are off`);
    if(work===0) d.warn.push('No doctor on this day');
    else{
      const cov=coverage(d.shifts,540,1230,d.dow===0?[780,960]:null);
      const zero=cov.find(c=>c[1]===0);
      if(zero) d.warn.push(`No doctor at ${fmt(zero[0])}`);
    }
  });
  const stats=[0,1,2].map(i=>({leave:leave[i],cl:cl[i],sun:sun[i],DS:tally[i].DS,DE:tally[i].DE,DM:tally[i].DM,
    req:days.filter(d=>d.cells[i]==='O').length}));
  const mw=[];
  stats.forEach((s,i)=>{
    if(s.leave>LV) mw.push(`${nameOf('doc',i)} has ${s.leave} leave days. The limit is ${LV}.`);
    else if(s.leave<LV) mw.push(`${nameOf('doc',i)} has ${s.leave} leave days. The target is ${LV}.`);
    if(s.cl>CLM) mw.push(`${nameOf('doc',i)} used ${s.cl} casual leave days. The limit is ${CLM}.`);
  });
  return {team:'doc',y,m,days,stats,mw,carry,shared:md.shared||null};
}

/* ---------- Month calculation with Sunday carry ---------- */
function computeMonth(team,y,m){
  const gen=team==='doc'?generateDoc:generateAsst;
  let carry=[0,0,0];
  let [sy,sm]=String(db.settings.startMonth||ymKey(y,m)).split('-').map(Number);
  let safety=0;
  while((sy<y||(sy===y&&sm<m))&&safety++<240){
    const r=gen(sy,sm,carry);
    carry=carry.map((c,i)=>c+r.stats[i].sun);
    sm++; if(sm>12){sm=1;sy++;}
  }
  return gen(y,m,carry);
}
function dayInfo(team,date){ const [y,m,d]=parseIso(date); return computeMonth(team,y,m).days[d-1]; }

function consFor(date){
  const [y,m]=parseIso(date), dow=new Date(y,m-1,parseIso(date)[2]).getDay();
  const abs=(monthData(y,m,false).cons||{})[date]||{};
  return db.consultants.map((c,i)=>({i,name:c.name,start:+c.start,end:+c.end,time:fmtRange(+c.start,+c.end),absent:!!abs[i]}))
    .filter(c=>db.consultants[c.i].days.includes(dow));
}

/* ---------- Freezing: past days never change; after sharing, edits move only later days ---------- */
function freezeDays(team,y,m,pred){
  const r=computeMonth(team,y,m), td=teamData(team,y,m,true); let ch=false;
  r.days.forEach(d=>{ if(pred(d)&&!td.snap[d.date]){ td.snap[d.date]=d.shifts.slice(); ch=true; } });
  return ch;
}
function freezePast(){
  const T=todayIso(); const [ty,tm]=parseIso(T);
  let ch=false;
  ['asst','doc'].forEach(team=>{
    let [sy,sm]=String(db.settings.startMonth).split('-').map(Number), safety=0;
    while((sy<ty||(sy===ty&&sm<=tm))&&safety++<240){
      if(freezeDays(team,sy,sm,d=>d.date<T)) ch=true;
      sm++; if(sm>12){sm=1;sy++;}
    }
  });
  if(ch) save();
}
function beforeEdit(team,date){
  const T=todayIso(), [y,m]=parseIso(date), td=teamData(team,y,m,true);
  if(date<T) return 'Saved. Past days do not move.';
  delete td.snap[date];
  if(td.shared){ freezeDays(team,y,m,d=>d.date<date); return 'Saved. Only the days after this day can move.'; }
  return 'Saved. The site rebalanced the month.';
}

/* ---------- Today ---------- */
function renderToday(){
  const base=new Date(); base.setDate(base.getDate()+view.dayOffset);
  const date=isoOf(base), da=dayInfo('asst',date), dd=dayInfo('doc',date), tv=db.settings.todayView;
  const cons=consFor(date), show=k=>tv==='all'||tv===k;
  const label=view.dayOffset===0?'Today':view.dayOffset===1?'Tomorrow':view.dayOffset===-1?'Yesterday':WD[base.getDay()];
  let h='';
  if(defaultNames('asst')||defaultNames('doc')) h+=`<div class="info"><b>First step:</b> add the names of the doctors and assistants.<button class="btn primary" onclick="setTab('settings')">Add names</button></div>`;
  const lb=db.settings.lastBackup, hasData=Object.values(db.months).some(md=>Object.keys(md.cells||{}).length||Object.keys(md.busy||{}).length||Object.keys((md.doc||{}).cells||{}).length);
  const snz=db.settings.backupHiddenAt||0, week=7*864e5;
  if(hasData&&(!lb||(Date.now()-lb)>week)&&(Date.now()-snz)>week) h+=`<div class="alert closable">
    <button class="x" onclick="hideBackup()" aria-label="Close this message">✕</button>
    You have no backup from the last 7 days.<button class="btn" onclick="exportData()">Download backup</button></div>`;
  h+=`<div class="daynav"><div><b>${label}</b><span>${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][base.getDay()]}, ${base.getDate()} ${MN[base.getMonth()]}</span></div>
    <button onclick="moveDay(-1)" aria-label="Previous day">‹</button><button onclick="moveDay(1)" aria-label="Next day">›</button></div>`;
  h+=dayStrip(dd,da,cons,view.dayOffset===0,show);
  const warns=ws=>ws.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('');
  if(show('doc')) h+=`<div class="grouphead"><h2>Doctors</h2></div><div class="tiles">${personTiles('doc',date,dd)}</div>${warns(dd.warn)}`;
  if(show('asst')) h+=`<div class="grouphead"><h2>Assistants</h2></div><div class="tiles">${personTiles('asst',date,da)}</div>
    <button class="busypill ${da.busy?'on':''}" onclick="toggleBusy('${date}')">⚡ Busy 1–4 PM: ${da.busy?'Yes':'No'} <span>(tap to ${da.busy?'remove':'add'} a Morning shift)</span></button>${warns(da.warn)}`;
  if(show('cons')){
    h+=`<div class="grouphead"><h2>Consultants</h2></div>`;
    h+=cons.length?`<div class="tiles">${cons.map(c=>`<button class="tile" style="background:${c.absent?'#F6F0EA':'#DCE2EF'};color:${c.absent?'#A8968A':'#272D4E'}" onclick="toggleCons('${date}',${c.i})">
        <span class="tn">${esc(c.name)}</span><span><span class="ts" style="display:block">${c.absent?'Not coming':'In clinic'}</span><span class="tt" style="display:block">${c.time}</span></span></button>`).join('')}</div>
        <p class="small" style="margin:8px 2px 0">Tap a consultant to mark the day as not coming.</p>`
      :`<p class="small" style="margin:0 2px">No consultant comes on ${WD[base.getDay()]}.</p>`;
  }
  h+=`<button class="btn primary" onclick="shareDay('${date}')">Send this day on WhatsApp</button>`;
  h+=`<div class="card" style="margin-top:14px"><h2>How to use this site</h2><p class="small">
    1. At the start of the month, open <b>Off days</b>. Tap the days each person asked for.<br>
    2. Open <b>Rota</b>. Check the shifts. Tap a cell to change it.<br>
    3. Tap <b>Share</b> to send the month to the staff group.<br>
    4. Each day, open <b>Today</b> to see who works when.</p></div>`;
  return h;
}
function personTiles(team,date,d){
  return [0,1,2].map(i=>{
    const c=d.shifts[i], sh=SH[c];
    return `<button class="tile ${d.locked[i]?'locked':''}" style="background:${sh.bg};color:${sh.fg}" onclick="openPick('${team}','${date}',${i})" aria-label="${esc(nameOf(team,i))}: ${shLabel(team,c)}">
      <span class="tn">${esc(nameOf(team,i))}</span>
      <span><span class="ts" style="display:block">${shLabel(team,c)}</span><span class="tt" style="display:block">${shTime(team,c)}</span></span></button>`;
  }).join('');
}
function dayStrip(dd,da,cons,showNow,show){
  const A=480,B=1230,pc=t=>((t-A)/(B-A)*100).toFixed(2)+'%';
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const overlay=`<div class="line6" style="left:${pc(1080)}"></div>${showNow&&nowMin>=A&&nowMin<=B?`<div class="now" style="left:${pc(nowMin)}"></div>`:''}`;
  const row=(lab,col,iv,barCol)=>`<div class="srow"><span class="sl" style="color:${col}">${esc(lab)}</span><div class="track">${iv.map(([a,b])=>`<div class="bar" style="left:${pc(a)};width:calc(${pc(b)} - ${pc(a)});background:${barCol}"></div>`).join('')}${overlay}</div></div>`;
  let h=`<div class="strip" aria-label="Who is in the clinic">`;
  if(show('doc')) h+=`<div class="grp">Doctors</div>`+[0,1,2].map(i=>row(initials('doc',i),COL.doc[i],SH[dd.shifts[i]].iv,SH[dd.shifts[i]].bar)).join('');
  if(show('asst')) h+=`<div class="grp">Assistants</div>`+[0,1,2].map(i=>row(initials('asst',i),COL.asst[i],SH[da.shifts[i]].iv,SH[da.shifts[i]].bar)).join('');
  if(show('cons')&&cons.length) h+=`<div class="grp">Consultants</div>`+cons.map(c=>row('C'+(c.i+1),CONS_COL,c.absent?[]:[[c.start,c.end]],'#94a3b8')).join('');
  h+=`<div class="ticks">${[[480,'8 AM'],[720,'12'],[960,'4 PM'],[1080,'6'],[1230,'8:30']].map(([t,l])=>`<span class="tick" style="left:${pc(t)}">${l}</span>`).join('')}</div>`;
  const at=(shifts,t)=>shifts.filter(s=>SH[s].iv.some(([a,b])=>t>=a&&t<b)).length;
  const pl=(n,w)=>`<b>${n}</b> ${w}${n===1?'':'s'}`;
  const cnt=t=>[show('doc')?pl(at(dd.shifts,t),'doctor'):'',show('asst')?pl(at(da.shifts,t),'assistant'):'',
    show('cons')?pl(cons.filter(c=>!c.absent&&t>=c.start&&t<c.end).length,'consultant'):''].filter(Boolean).join(', ');
  h+=`<div class="counts"><span>After 6 PM: ${cnt(1080)}</span><span>1 to 4 PM: ${cnt(840)}</span></div>`;
  return h+`</div>`;
}
function toggleCons(date,i){
  const [y,m]=parseIso(date), md=monthData(y,m,true);
  const c=md.cons[date]||{};
  if(c[i]) delete c[i]; else c[i]=true;
  if(Object.keys(c).length) md.cons[date]=c; else delete md.cons[date];
  save(); keepScroll(render); toast(c[i]?`${db.consultants[i].name} is marked not coming.`:`${db.consultants[i].name} is marked as coming.`);
}

    const rt=R[t], target=tgt(t);
    if(teamsShown().length>1) h+=`<div class="grp" style="margin:4px 2px 6px">${TEAM[t].label}</div>`;
    h+=`<div class="whos">${[0,1,2].map(i=>{
      const s=rt.stats[i], o=t==='doc'?s.leave:s.off, cls=o===target?'ok':'bad';
      const sub=t==='doc'
        ?`${s.req} asked, ${o-s.req} auto, ${s.sun} Sunday<br>Casual leave: ${s.cl} of ${CLM} used`
        :`${s.req} asked, ${o-s.req} auto, ${s.sun} Sunday`;
      const on=team===t&&sel===i;
      return `<button class="who ${on?'on':''}" style="--c:${COL[t][i]}" onclick="view.who='${t}:${i}';if('${t}'!=='doc')view.planMode='O';render()">${badge(t,i,32)}
        <div>${esc(nameOf(t,i))}<small>${sub}</small></div><span class="cnt ${cls}">${o}/${target}</span></button>`;}).join('')}</div>`;
  });
  h+=`<p class="tip" style="margin-top:4px">Calendar for <b style="color:${COL[team][sel]}">${esc(nameOf(team,sel))}</b> and the other ${TEAM[team].label.toLowerCase()}.</p>`;
  h+=`<div class="calh">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div>${x}</div>`).join('')}</div><div class="cal">`;
  const lead=(r.days[0].dow+6)%7;
  for(let k=0;k<lead;k++) h+=`<div></div>`;
  r.days.forEach(d=>{
    const mine=d.cells[sel]==='O'||d.cells[sel]==='CL';
    const minis=d.off.map(i=>{
      const isCL=d.shifts[i]==='CL';
      const kind=isCL?'cl':d.cells[i]==='O'?'':(d.frozen?'fixed':'auto');
      return `<span class="mini ${kind}" style="--c:${COL[team][i]}">${esc(initials(team,i))}${isCL?' CL':''}</span>`;}).join('');
    h+=`<button class="cday ${d.dow===0?'sun':''} ${d.date<T?'past':''} ${d.date===T?'today':''} ${mine?'mine':''}" style="--c:${COL[team][sel]}" onclick="planTap('${d.date}')" aria-label="${d.day} ${MN[r.m-1]}"><b>${d.day}</b>${minis}</button>`;
  });
  h+=`</div><div class="legend" style="margin-top:10px">
    <span class="chip" style="background:#fff;border:1px solid var(--line)">Solid: the person asked</span>
    <span class="chip" style="background:#fff;border:1px dashed #9aa9a5">Dashed: added by the site</span>
    ${team==='doc'?'<span class="chip" style="background:#fce7f3;color:#9d174d">CL: casual leave</span>':''}</div>`;
  if(team==='doc') h+=`<p class="small">The Morning doctor has no Sunday duty. The other two doctors take Sundays in turn. A Sunday off counts as a leave day.</p>`;
  const mw=teamsShown().flatMap(t=>R[t].mw);
  if(mw.length) h+=`<div class="alert"><ul>${mw.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`;
  h+=`<button class="btn primary" onclick="setTab('rota')">Make the rota</button>`;
  return h;
}
function planTap(date){
  if(date<todayIso()) return toast('This day is in the past.');
  const team=whoTeam(), i=whoIdx(), [y,m,dd]=parseIso(date), td=teamData(team,y,m,true);
  const code=team==='doc'?view.planMode:'O';
  const dow=new Date(y,m-1,dd).getDay();
  if(team==='doc'&&dow===0&&db.doctors.defaults[i]==='DM') return toast(`${nameOf(team,i)} has no Sunday duty.`);
  const c=td.cells[date]||{};
  if(c[i]===code){ delete c[i]; }
  else{
    const other=[0,1,2].find(k=>k!==i&&(c[k]==='O'||c[k]==='CL'));
    if(other!==undefined) return toast(`${nameOf(team,other)} already asked for this day. Only 1 person can be off.`);
    if(code==='CL'){
      const used=computeMonth(team,y,m).stats[i].cl;
      if(used>=(+db.doctors.cl||2)) return toast(`${nameOf(team,i)} already used all casual leave this month.`);
    }
    c[i]=code;
  }
  delete td.snap[date];
  if(Object.keys(c).length) td.cells[date]=c; else delete td.cells[date];
  save(); keepScroll(render);
}

/* ---------- Rota ---------- */
function cellHtml(team,d,i){
  const c=d.shifts[i], s=SH[c];
  return `<button class="cell ${d.locked[i]?'locked':''}" style="background:${s.bg};color:${s.fg}" onclick="openPick('${team}','${d.date}',${i})"><span class="ini">${esc(initials(team,i))}</span>${shShort(team,c)}<small>${team==='doc'&&c==='O'?'Day off':s.time}</small></button>`;
}
const CODES={doc:['DS','DE','DM','O','CL'],asst:['S','SE','L','O']};
function renderRota(R){
  const T=todayIso(), teams=teamsShown(), both=teams.length>1;
  let h=stepsHtml('rota');
  teams.forEach(t=>{
    h+=`<div class="legend">${both?`<span class="chip" style="background:none;color:var(--mute);padding-left:0">${TEAM[t].label}</span>`:''}${CODES[t].map(k=>`<span class="chip" style="background:${SH[k].bg};color:${SH[k].fg}">${shLabel(t,k)}${SH[k].iv.length?' '+SH[k].time:''}</span>`).join('')}</div>`;
  });
  const shared=teams.filter(t=>R[t].shared);
  h+=shared.length
    ? `<div class="info">You shared the ${shared.map(t=>TEAM[t].label.toLowerCase()).join(' and ')} rota. A change now moves only the days after it.</div>`
    : `<p class="tip">Tap a cell to change it or swap it. A dot means you set it.${teams.includes('asst')?' Tap ⚡ for a busy 1–4 PM day.':''}${teams.includes('doc')?' Tap a consultant to mark a day as not coming.':''}</p>`;
  const mw=teams.flatMap(t=>R[t].mw);

  if(mw.length||dayWarn){
    h+=`<div class="alert"><b>Check this month</b><ul>${mw.map(w=>`<li>${esc(w)}</li>`).join('')}${dayWarn?`<li>${dayWarn} day(s) have a warning below.</li>`:''}</ul></div>`;
  }
  const cls=both?'both':(teams[0]==='doc'?'doc':'');
  h+=`<div class="${cls}"><div class="ghead">`;
  teams.forEach((t,n)=>{
    h+=`<div class="hrow"><div class="plain">${n===0?'Date':''}</div>${[0,1,2].map(i=>`<div style="background:${COL[t][i]}">${esc(nameOf(t,i))}</div>`).join('')}${t==='asst'?'<div class="plain">Busy</div>':(both?'<div class="plain"></div>':'')}</div>`;
  });
  h+=`</div>`;
  R[teams[0]].days.forEach((d0,k)=>{
    h+=`<div class="day ${d0.dow===0?'sun':''} ${d0.date===T?'today':''}" id="d-${d0.date}">`;
    teams.forEach((t,n)=>{
      const d=R[t].days[k];
      h+=`<div class="row ${n?'second':''}">
        <div class="date">${n===0?`<b>${d.day}</b><span>${WD[d.dow]}</span>`:''}</div>
        ${[0,1,2].map(i=>cellHtml(t,d,i)).join('')}
        ${t==='asst'?`<button class="busy ${d.busy?'on':''}" onclick="toggleBusy('${d.date}')" aria-label="Busy day">⚡</button>`:(both?'<div></div>':'')}
      </div>`;
      if(t==='doc'){
        const cons=consFor(d.date);
        if(cons.length) h+=`<div class="consline">${cons.map(c=>`<button class="cons ${c.absent?'absent':''}" onclick="toggleCons('${d.date}',${c.i})">${esc(c.name)} ${c.time}</button>`).join('')}</div>`;
      }
    });
    teams.forEach(t=>{ h+=R[t].days[k].warn.map(w=>`<div class="warn">⚠ ${both?TEAM[t].label+': ':''}${esc(w)}</div>`).join(''); });
    h+=`</div>`;
  });
  h+=`</div><button class="btn primary" onclick="shareImage()">Share this month</button>`;
  return h;
}

/* ---------- Actions ---------- */
function setName(i,v){db.settings.names[i]=v.trim()||`Assistant ${i+1}`;save();render();}
function setDocName(i,v){db.doctors.names[i]=v.trim()||`Doctor ${i+1}`;save();render();}
function setDocDefault(i,v){db.doctors.defaults[i]=v;save();render();toast('Fixed shift saved.');}
function setDoc(k,v){db.doctors[k]=Math.max(0,Math.min(15,+v||0));save();render();}
function setCons(i,k,v){db.consultants[i][k]=v.trim()||`Consultant ${i+1}`;save();render();}
function toggleConsDay(i,w){const d=db.consultants[i].days;const k=d.indexOf(w);if(k>=0)d.splice(k,1);else d.push(w);save();keepScroll(render);}
function setConsTime(i,k,v){const [h,m]=v.split(':').map(Number);if(isNaN(h))return;db.consultants[i][k]=h*60+(m||0);save();keepScroll(render);}
function setSetting(k,v){if(k==='startMonth'&&!/^\d{4}-\d{2}$/.test(v))return;db.settings[k]=v;save();render();}

function toggleBusy(date){
  const msg=beforeEdit('asst',date);
  const [y,m]=parseIso(date), md=monthData(y,m,true);
  if(md.busy[date]) delete md.busy[date]; else md.busy[date]=true;
  save(); keepScroll(render); toast(msg);
}

function openPick(team,date,i){
  const d=dayInfo(team,date), [y,m,dd]=parseIso(date);
  document.getElementById('sheetTitle').innerHTML=`${badge(team,i,30)}<span>${esc(nameOf(team,i))}, ${WD[d.dow]} ${dd} ${MN[m-1].slice(0,3)}</span>`;
  const curOv=d.cells[i]||'';
  const opts=team==='doc'
    ?[['','Automatic','Use the fixed shift'],['DS',SH.DS.label,SH.DS.time],['DE',SH.DE.label,SH.DE.time],['DM',SH.DM.label,SH.DM.time],['O','Leave','Counts in the leave days'],['CL','Casual leave',`${computeMonth(team,y,m).stats[i].cl} of ${+db.doctors.cl||2} used`]]
    :[['','Automatic','Let the site decide'],['S',SH.S.label,SH.S.time],['SE',SH.SE.label,SH.SE.time],['L',SH.L.label,SH.L.time],['O','Off','Day off']];
  let h=`<div class="sub">Set a shift</div>`+opts.map(([k,l,t])=>
    `<button class="opt ${curOv===k?'sel':''}" onclick="pick('${team}','${date}',${i},'${k}')">${l}<span>${t}</span></button>`).join('');
  h+=`<div class="sub">Or swap with</div>`+[0,1,2].filter(k=>k!==i).map(k=>
    `<button class="opt" onclick="swapCells('${team}','${date}',${i},${k})">⇄ ${esc(nameOf(team,k))}<span>${shLabel(team,d.shifts[i])} and ${shLabel(team,d.shifts[k])}</span></button>`).join('');
  document.getElementById('sheetOpts').innerHTML=h;
  document.getElementById('sheet').classList.add('show');
}
function closeSheet(){document.getElementById('sheet').classList.remove('show');}
function pick(team,date,i,k){
  const [y,m]=parseIso(date), td=teamData(team,y,m,true);
  const c=td.cells[date]||{};
  if(k==='O'||k==='CL'){
    const other=[0,1,2].find(x=>x!==i&&(c[x]==='O'||c[x]==='CL'));
    if(other!==undefined){ closeSheet(); return toast(`${nameOf(team,other)} is already off on this day.`); }
    if(k==='CL'&&c[i]!=='CL'&&computeMonth(team,y,m).stats[i].cl>=(+db.doctors.cl||2)){ closeSheet(); return toast(`${nameOf(team,i)} already used all casual leave this month.`); }
  }
  const msg=beforeEdit(team,date);
  if(k) c[i]=k; else delete c[i];
  if(Object.keys(c).length) td.cells[date]=c; else delete td.cells[date];
  save(); closeSheet(); keepScroll(render); toast(msg);
}
function swapCells(team,date,i,k){
  const d=dayInfo(team,date);
  const msg=beforeEdit(team,date);
  const [y,m]=parseIso(date), td=teamData(team,y,m,true);
  const c=td.cells[date]||{};
  c[i]=d.shifts[k]; c[k]=d.shifts[i];
  td.cells[date]=c;
  save(); closeSheet(); keepScroll(render); toast(`${nameOf(team,i)} and ${nameOf(team,k)} swapped. `+msg.replace('Saved. ',''));
}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y);}

function recalcFuture(){
  const T=todayIso();
  teamsShown().forEach(t=>{ const td=teamData(t,view.y,view.m,true); Object.keys(td.snap).forEach(k=>{ if(k>=T) delete td.snap[k]; }); td.shared=null; });
  save(); render(); toast('The site recalculated the days from today.');
}
function resetMonth(){
  const who=teamsShown().map(t=>TEAM[t].label.toLowerCase()).join(' and ');
  if(!confirm(`Clear your changes for the ${who} in ${MN[view.m-1]} ${view.y} from today on?`)) return;
  const T=todayIso(), md=monthData(view.y,view.m,true);
  teamsShown().forEach(t=>{
    const td=teamData(t,view.y,view.m,true);
    const fields=t==='asst'?[[md,'cells'],[md,'busy'],[md,'snap']]:[[td,'cells'],[td,'snap']];
    fields.forEach(([o,f])=>Object.keys(o[f]).forEach(k=>{ if(k>=T) delete o[f][k]; }));
    td.shared=null;
  });
  save(); render(); toast('The month is reset from today.');
}

function exportData(){
  db.settings.lastBackup=Date.now(); save();
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`clinic-rota-backup-${todayIso()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  render();
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.settings||!d.months) throw new Error('bad');
      if(!confirm('Replace the current data with this backup?')) return;
      db=d; migrate(); save(); render(); alert('The backup is restored.');
    }catch(e){alert('This file is not a valid rota backup.');}
    inp.value='';
  };
  r.readAsText(f);
}

/* ---------- Sharing ---------- */
function shareNow(){ if(view.tab==='today'){ const b=new Date(); b.setDate(b.getDate()+view.dayOffset); shareDay(isoOf(b)); } else shareImage(); }

function dayText(date){
  const dd=dayInfo('doc',date), da=dayInfo('asst',date), [y,m,d]=parseIso(date), tv=db.settings.todayView, show=k=>tv==='all'||tv===k;
  const L=[`*Duty for ${WD[dd.dow]} ${d} ${MN[m-1].slice(0,3)}*`];
  if(show('doc')) L.push('','*Doctors*');
  if(show('doc')) [0,1,2].forEach(i=>{ const c=dd.shifts[i]; L.push(SH[c].iv.length?`${nameOf('doc',i)}: ${shLabel('doc',c)} (${SH[c].time})`:`${nameOf('doc',i)}: ${shLabel('doc',c)}`); });
  if(show('asst')) L.push('','*Assistants*');
  if(show('asst')) [0,1,2].forEach(i=>{ const c=da.shifts[i]; L.push(c==='O'?`${nameOf('asst',i)}: Off`:`${nameOf('asst',i)}: ${SH[c].label} (${SH[c].time})`); });
  if(show('asst')&&da.busy) L.push('⚡ Busy day');
  if(show('cons')){ const cons=consFor(date); if(cons.length){ L.push('','*Consultants*'); cons.forEach(c=>L.push(`${c.name}: ${c.absent?'Not coming':c.time}`)); } }
  return L.join('\n');
}
async function shareDay(date){
  const text=dayText(date);
  if(navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}

function drawRota(team,y,m){
  const r=computeMonth(team,y,m), n=r.days.length, W=1000, rowH=38, top=150, colW=(W-160)/3;
  const consNote=team==='doc'?db.consultants.map(c=>`${c.name}: ${c.days.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(w=>WD[w]).join(', ')} ${fmtRange(+c.start,+c.end)}`):[];
  const H=top+rowH*n+120+consNote.length*30;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d'), F='"Plus Jakarta Sans",system-ui,sans-serif', FS='"Instrument Serif",Georgia,serif';
  g.fillStyle='#ffffff'; g.fillRect(0,0,W,H);
  g.fillStyle='#272D4E'; g.fillRect(0,0,W,96);
  g.fillStyle='#fff'; g.font=`40px ${FS}`; g.fillText(`${db.settings.clinic||'Clinic'}: ${TEAM[team].label} rota`,30,48);
  g.font=`22px ${F}`; g.fillText(`${MN[m-1]} ${y}`,30,82);
  g.font=`bold 20px ${F}`;
  g.fillStyle='#6B6F85'; g.fillText('Date',30,top-18);
  [0,1,2].forEach(i=>{ g.fillStyle=COL[team][i]; g.textAlign='center'; g.fillText(nameOf(team,i).slice(0,20),160+colW*i+colW/2,top-18); g.textAlign='left'; });
  r.days.forEach((d,k)=>{
    const yy=top+k*rowH;
    if(d.dow===0){ g.fillStyle='#FBF6F1'; g.fillRect(0,yy,W,rowH); }
    g.fillStyle='#272D4E'; g.font=`bold 18px ${F}`;
    g.fillText(`${pad(d.day)} ${WD[d.dow]}${d.busy?' ⚡':''}`,30,yy+25);
    d.shifts.forEach((s,i)=>{
      const x=160+colW*i+6, sh=SH[s];
      g.fillStyle=sh.bg; roundRect(g,x,yy+4,colW-12,rowH-8,8); g.fill();
      g.fillStyle=sh.fg; g.font=`bold 17px ${F}`; g.textAlign='center';
      g.fillText(sh.iv.length?`${sh.label} (${sh.time})`:shLabel(team,s).toUpperCase(),x+(colW-12)/2,yy+25); g.textAlign='left';
    });
    g.strokeStyle='#EDE3DA'; g.beginPath(); g.moveTo(20,yy+rowH); g.lineTo(W-20,yy+rowH); g.stroke();
  });
  g.fillStyle='#6B6F85'; g.font=`17px ${F}`;
  const legend=team==='doc'
    ?'Split: 9 AM–1 PM and 4–8:30 PM   Second: 12:30–8:30 PM   Morning: 10 AM–1 PM'
    :'Split: 8 AM–1 PM and 4–8:30 PM   Second: 12–8:30 PM   Morning: 8 AM–5 PM';
  g.fillText(legend,30,top+rowH*n+45);
  g.fillText(team==='doc'?'CL = casual leave':'⚡ = busy day (extra cover 1–4 PM)',30,top+rowH*n+75);
  consNote.forEach((t,k)=>g.fillText(t,30,top+rowH*n+105+k*30));
  return new Promise(res=>c.toBlob(b=>res(new File([b],`${team==='doc'?'doctor':'assistant'}-rota-${ymKey(y,m)}.png`,{type:'image/png'})),'image/png'));
}
async function shareImage(){
  const teams=teamsShown(), y=view.y, m=view.m;
  const files=await Promise.all(teams.map(t=>drawRota(t,y,m)));
  const markShared=()=>{
    let ch=false;
    teams.forEach(t=>{ const td=teamData(t,y,m,true); if(!td.shared){ td.shared=Date.now(); ch=true; } });
    if(ch){ save(); render(); toast('Marked as shared. Later changes move only the days after them.'); }
  };
  if(navigator.canShare&&navigator.canShare({files})){
    try{ await navigator.share({files,title:`Rota ${MN[m-1]} ${y}`}); markShared(); }catch(e){}
  }else{
    files.forEach(f=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); });
    markShared();
  }
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ---------- Start ---------- */
freezePast();
render();
window.addEventListener('resize',()=>document.documentElement.style.setProperty('--hh',document.getElementById('hdr').offsetHeight+'px'));
</script>
